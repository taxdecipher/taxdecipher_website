{# Put inside <head> of every admin page: shared sidebar CSS + no-flicker restore #}
<link href="{{ url_for('static', filename='css/admin-sidebar.css') }}?v=2" rel="stylesheet">
<script>
    (function () {
        try {
            if (window.innerWidth > 900 &&
                localStorage.getItem("taxDecipherSidebarCollapsed") === "true") {
                document.documentElement.classList.add("sidebar-collapsed-pre");
            }
        } catch (e) {}
    })();
</script>
<style>
    /* Applied before the page paints so the sidebar never "jumps" (desktop only) */
    @media (min-width: 901px) {
    html.sidebar-collapsed-pre .sidebar { width: var(--sidebar-collapsed); transition: none; }
    html.sidebar-collapsed-pre .main-content { margin-left: var(--sidebar-collapsed); transition: none; }
    html.sidebar-collapsed-pre .sidebar .brand,
    html.sidebar-collapsed-pre .sidebar .menu-text,
    html.sidebar-collapsed-pre .sidebar .menu-label,
    html.sidebar-collapsed-pre .sidebar .footer-text { display: none; }
    html.sidebar-collapsed-pre .sidebar-header { justify-content: center; padding: 0; gap: 0; }
    html.sidebar-collapsed-pre .sidebar-menu a,
    html.sidebar-collapsed-pre .sidebar-footer a { justify-content: center; }
    html.sidebar-collapsed-pre .sidebar-menu a.active { border-left: 0; }
    }
</style>
