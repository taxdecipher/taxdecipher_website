
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ title }} | Tax Decipher Preview</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: #f7f8fc;
            color: #252638;
            font-family: Arial, sans-serif;
        }

        /* Header */
        .site-header {
            background: white;
            border-bottom: 1px solid #e9eaf0;
            padding: 18px 0;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: #202235;
            font-size: 21px;
            font-weight: 800;
        }

        .brand-logo {
            width: 39px;
            height: 39px;
            border-radius: 10px;
            background: #5145cd;
            color: white;
            display: grid;
            place-items: center;
        }

        /* Article */
        .article-container {
            max-width: 850px;
            margin: 45px auto;
            padding: 0 18px;
        }

        .article-box {
            background: white;
            border: 1px solid #ececf2;
            border-radius: 14px;
            padding: 35px;
            overflow: hidden;
        }

        .back-link {
            color: #5145cd;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }

        .category {
            color: #5145cd;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            margin-top: 25px;
        }

        .article-title {
            font-size: 34px;
            line-height: 1.35;
            font-weight: 800;
            margin: 12px 0;
        }

        .article-date {
            color: #9295a7;
            font-size: 13px;
            margin-bottom: 25px;
        }

        /* Article Content */
        .article-content {
            font-size: 16px;
            line-height: 1.85;
            overflow-wrap: anywhere;

            /* Allows floated images to stay within the article */
            display: flow-root;
        }

        /*
         * IMAGE RESIZING FIX
         *
         * Preserve inline width, float, display and margin
         * coming from the editor.
         */
        .article-content img {
            max-width: 100% !important;
            height: auto !important;
            border-radius: 8px;
            vertical-align: middle;
        }

        /* Do not force image dimensions on paragraphs */
        .article-content p {
            margin-bottom: 1em;
        }

        .article-content blockquote {
            border-left: 4px solid #5145cd;
            padding-left: 18px;
            color: #666;
            margin: 25px 0;
        }

        .article-content pre {
            background: #f1f2f6;
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
        }

        .article-content table {
            max-width: 100%;
            display: block;
            overflow-x: auto;
        }

        .article-content iframe {
            max-width: 100%;
        }

        @media (max-width: 600px) {
            .article-content img {
                float: none !important;
                display: block;
                margin-left: auto !important;
                margin-right: auto !important;
            }
        }

        /* Quill Alignment */
        .article-content .ql-align-center {
            text-align: center;
        }

        .article-content .ql-align-right {
            text-align: right;
        }

        .article-content .ql-align-justify {
            text-align: justify;
        }

        .article-content .ql-indent-1 {
            padding-left: 3em;
        }

        .article-content .ql-indent-2 {
            padding-left: 6em;
        }

        .article-content .ql-indent-3 {
            padding-left: 9em;
        }

        /* Footer */
        .site-footer {
            background: #171a2b;
            color: #c5c6d0;
            text-align: center;
            padding: 25px 15px;
            font-size: 13px;
            margin-top: 50px;
        }

        /* Mobile */
        @media (max-width: 600px) {
            .article-box {
                padding: 20px;
            }

            .article-title {
                font-size: 26px;
            }

            .article-content {
                font-size: 15px;
            }

            .article-container {
                margin: 25px auto;
            }
        }
    </style>
</head>

<body>

    <!-- Header -->
    <header class="site-header">
        <div class="container">
            <a href="{{ url_for('public.index') }}" class="brand">
                <span class="brand-logo">TD</span>
                <span>Tax Decipher</span>
            </a>
        </div>
    </header>

    <!-- Article Preview -->
    <main class="article-container">

        <article class="article-box">

            <a href="{{ url_for('public.index') }}" class="back-link">
                ← Back to Articles
            </a>

            <div class="category">
                {{ category|default('General', true) }}
            </div>

            <h1 class="article-title">
                {{ title }}
            </h1>

            <div class="article-date">
                Article Preview — Not Published
            </div>

            <!-- Article images retain editor settings -->
            <div class="article-content">
                {{ content_html|safe }}
            </div>

        </article>

    </main>

    <!-- Footer -->
    <footer class="site-footer">
        © {{ now_year|default(2026) }} Tax Decipher. All Rights Reserved.
    </footer>

</body>
</html>
