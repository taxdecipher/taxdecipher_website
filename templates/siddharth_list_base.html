<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block page_title %}{% endblock %} | {{ profile.get('full_name', 'Siddharth Thakur') }}</title>
    <meta name="description" content="{% block page_desc %}{% endblock %}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/siddharth.css') }}?v=1" rel="stylesheet">
</head>

<body>

<nav class="navbar sticky-top">
    <div class="container">
        <a class="brand" href="{{ url_for('siddharth_public.siddharth_profile') }}">
            {{ profile.get('full_name', 'Siddharth Thakur') }}<span>.</span>
        </a>
        <div class="d-flex flex-wrap gap-2">
            <a class="btn-outline-custom" href="{{ url_for('siddharth_public.siddharth_profile') }}">
                <i class="bi bi-arrow-left me-2"></i> Back to profile
            </a>
            <a class="btn-outline-custom" href="{{ url_for('public.index') }}">
                <i class="bi bi-house-door me-2"></i> Tax Decipher Home
            </a>
        </div>
    </div>
</nav>

<section class="section section-light" style="min-height: 70vh;">
    <div class="container">
        <div class="section-label">{% block label %}{% endblock %}</div>
        <h1 class="section-heading">{% block heading %}{% endblock %}</h1>

        {% block body %}{% endblock %}
    </div>
</section>

<footer>
    <div class="container d-flex flex-wrap justify-content-between gap-2">
        <span>
            © {{ current_year }} {{ profile.get('full_name', 'Siddharth Thakur') }}.
            All rights reserved.
        </span>
        <span>Designed with care.</span>
    </div>
</footer>

</body>
</html>
