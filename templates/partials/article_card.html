<a href="{{ url_for('public.article', slug=post['public_slug']) }}" class="article-card">
  <img src="{{ post['cover_photo'] or url_for('static', filename='image/logo.png') }}"
       alt="{{ post['title'] }}" width="230" height="160" loading="lazy" decoding="async">
  <div class="body">
    <div class="tag">{{ post['category'] or 'General' }}</div>
    <h3>{{ post['title'] }}</h3>
    <p>{{ post['content_html']|excerpt(220) }}</p>
    <div class="meta">
      <span><i class="bi bi-calendar3"></i> {{ post['published_at']|nice_date }}</span>
      <span>{{ post['content_html']|reading_time }} min read</span>
    </div>
  </div>
</a>
